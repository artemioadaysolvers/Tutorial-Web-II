<svg xmlns="http://www.w3.org/2000/svg" width="270" height="460" viewBox="0 0 270 460">
  <g fill="#806e55" font-family="'Courier New', Courier, monospace">
    <text x="1" y="23" font-size="9" letter-spacing="1.3">BIOT–SAVART</text>
    <text x="1" y="52" font-size="13">B(r) = (μ₀ I / 4π) ∫<tspan baseline-shift="sub" font-size="9">C</tspan></text>
    <text x="13" y="76" font-size="12">[dℓ′ × (r − r′)] / |r − r′|³</text>
    <path d="M1 102H269" fill="none" stroke="#c7b89b" stroke-width="0.7"/>
    <text x="1" y="130" font-size="9" letter-spacing="1.3">COULOMB · DISTRIBUCIÓN VOLUMÉTRICA</text>
    <text x="1" y="159" font-size="13">E(r) = (1 / 4πε₀) ∭<tspan baseline-shift="sub" font-size="9">V</tspan></text>
    <text x="13" y="183" font-size="11.5">ρ(r′)(r − r′) / |r − r′|³ dV′</text>
    <path d="M1 209H269" fill="none" stroke="#c7b89b" stroke-width="0.7"/>
    <text x="1" y="237" font-size="9" letter-spacing="1.3">FARADAY–LENZ</text>
    <text x="1" y="267" font-size="13">∮<tspan baseline-shift="sub" font-size="9">∂S</tspan> E·dℓ = −d/dt ∬<tspan baseline-shift="sub" font-size="9">S</tspan> B·n dS</text>
    <text x="1" y="294" font-size="12">∇ × E = −∂B/∂t</text>
    <path d="M1 321H269" fill="none" stroke="#c7b89b" stroke-width="0.7"/>
    <text x="1" y="349" font-size="9" letter-spacing="1.3">FUERZA MAGNÉTICA</text>
    <text x="1" y="379" font-size="14">F = q(v × B)</text>
    <text x="1" y="408" font-size="13">F = ∭<tspan baseline-shift="sub" font-size="9">V</tspan> (J × B) dV</text>
    <text x="1" y="439" font-size="10">r = (x, y, z) · CAMPOS VECTORIALES</text>
  </g>
</svg>
