<svg xmlns="http://www.w3.org/2000/svg" width="320" height="174" viewBox="0 0 320 174">
  <g fill="#806e55" font-family="'Courier New', Courier, monospace">
    <text x="2" y="20" font-size="9" letter-spacing="1.4">DIFUSIÓN DEL CALOR</text>
    <text x="2" y="48" font-size="15">ρ c<tspan baseline-shift="sub" font-size="10">p</tspan> ∂T/∂t = ∇·(k∇T) + q̇</text>
    <text x="2" y="71" font-size="11">∇²T = ∂²T/∂x² + ∂²T/∂y² + ∂²T/∂z²</text>
    <path d="M2 91H318" fill="none" stroke="#c7b89b" stroke-width="0.7"/>
    <text x="2" y="115" font-size="9" letter-spacing="1.4">LEY DE FOURIER</text>
    <text x="2" y="143" font-size="15">q = −k∇T</text>
    <text x="2" y="166" font-size="11">∇T = (∂T/∂x, ∂T/∂y, ∂T/∂z)</text>
  </g>
</svg>
