# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - web-recados-2026abc

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: registrorecados2026abc-cxeshfhhbtaadtdc.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_50E8D04A9C274393AA2166C15A59DA88 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_9884262FC04F43D68F0539B6090086E1 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: registrorecados2026abc-cxeshfhhbtaadtdc.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_50E8D04A9C274393AA2166C15A59DA88 }}/recados:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    
    needs: build
    
    steps:
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'web-recados-2026abc'
          slot-name: 'Production'
          images: 'registrorecados2026abc-cxeshfhhbtaadtdc.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_50E8D04A9C274393AA2166C15A59DA88 }}/recados:${{ github.sha }}'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_E08C7BACB27F477182188B61E701BBA5 }}